name: 'sap_snowflake_fiscal_engine'
version: '1.0.0'
config-version: 2

profile: 'default' # Points to your Snowflake credentials profile

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

models:
  sap_snowflake_fiscal_engine:
    # Upstream Layer: Cleans raw SAP data and runs as fast, low-cost Views
    staging:
      +materialized: view
      +schema: staging
    
    # Downstream Layer: Heavy business logic materialized as physical tables for Qlik/BI performance
    marts:
      +materialized: table
      +schema: finance
